    <style>
      #praqen-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;

        display: flex;

        transition: opacity 0.45s ease-out;

      #praqen-loader .logo-box {

        border-radius: 26px;

        align-items: center;

        color: #1B4332;

        margin-bottom: 18px;
        animation: prq-pulse 1.6s ease-in-out infinite;
        box-shadow: 0 0 40px rgba(244,164,34,0.4);
      }
      #praqen-loader .logo-name {

        font-size: 22px;
        font-weight: 800;
        letter-spacing: 4px;
        font-family: Georgia, serif;
        margin-bottom: 6px;

        font-size: 11px;
        letter-spacing: 1px;
        font-family: Arial, sans-serif;
        margin-bottom: 28px;
      }
      #praqen-loader .bar-track {
        width: 48px; height: 3px;
        background: rgba(255,255,255,0.15);
        border-radius: 99px;
        overflow: hidden;
      }
      #praqen-loader .bar-fill {
        height: 100%;
        background: #F4A422;
        border-radius: 99px;
        animation: prq-slide 1.3s ease-in-out infinite;
      }
      @keyframes prq-pulse {
        0%,100% { transform: scale(1);   box-shadow: 0 0 30px rgba(244,164,34,0.35); }
        50%      { transform: scale(1.06); box-shadow: 0 0 50px rgba(244,164,34,0.55); }
      }
      @keyframes prq-slide {
        0%   { width: 0%;   margin-left: 0%; }
        50%  { width: 60%;  margin-left: 20%; }
        100% { width: 0%;   margin-left: 100%; }
      }
    </style>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- PRAQEN Splash Loader — hidden once React mounts -->
    <div id="praqen-loader" aria-hidden="true">
      <div class="logo-box">P</div>
      <p class="logo-name">PRAQEN</p>
      <p class="logo-sub">P2P BITCOIN TRADING</p>
      <div class="bar-track">
        <div class="bar-fill"></div>
      </div>
    </div>

    <script>
      (function () {
        function hideLoader() {
          var el = document.getElementById('praqen-loader');
          if (!el) return;
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          setTimeout(function () { el.style.display = 'none'; }, 460);
        }
        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            setTimeout(hideLoader, 300);
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
        setTimeout(hideLoader, 4000);
      })();
    </script>
