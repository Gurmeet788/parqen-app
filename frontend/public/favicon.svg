<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A422"/>
      <stop offset="100%" stop-color="#D4891A"/>
    </linearGradient>
    <linearGradient id="pgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#0c2418"/>
    </linearGradient>
  </defs>
  <!-- Gold background with rounded corners -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#bg)"/>
  <!-- Subtle inner shadow ring for depth -->
  <rect width="100" height="100" rx="20" ry="20" fill="none"
        stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <!-- Bold "P" in forest green, visually centred -->
  <text x="50" y="52" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="70" font-weight="900"
        fill="url(#pgrad)">P</text>
</svg>
